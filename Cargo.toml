[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
insta = { version = "1", features = ["toml"] }

# allow unwrap/expect/panic only inside tests across the workspace
[workspace.metadata.lints-clippy-allow]
