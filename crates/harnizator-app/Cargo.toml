[package]
version.workspace = true
name = "harnizator-app"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "harnizator"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
harnizator-core = { path = "../harnizator-core" }
harnizator-providers = { path = "../harnizator-providers" }
harnizator-cli = { path = "../harnizator-cli" }
harnizator-tools = { path = "../harnizator-tools" }
harnizator-tui = { path = "../harnizator-tui" }
harnizator-store = { path = "../harnizator-store" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
toml.workspace = true
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rexpect = "0.5"
