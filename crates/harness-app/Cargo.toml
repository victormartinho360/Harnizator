[package]
name = "harness-app"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "harness-rs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
harness-core = { path = "../harness-core" }
harness-providers = { path = "../harness-providers" }
harness-cli = { path = "../harness-cli" }
harness-tools = { path = "../harness-tools" }
harness-tui = { path = "../harness-tui" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
toml.workspace = true
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
